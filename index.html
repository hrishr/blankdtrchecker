<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTR Checker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#6b7686;--bd:#dde2e9;--ac:#2557d6;--red:#c0392b;--redbg:#fdecea;--amb:#a66300;--ambbg:#fff3dc;--grn:#1e7e4a;--grnbg:#e3f5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1d232d;--tx:#e8ecf2;--mut:#9aa5b5;--bd:#303846;--ac:#6b93ff;--red:#ff8a7a;--redbg:#3a1f1c;--amb:#f3b04f;--ambbg:#3a2d14;--grn:#6fd49a;--grnbg:#16301f}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1d232d;--tx:#e8ecf2;--mut:#9aa5b5;--bd:#303846;--ac:#6b93ff;--red:#ff8a7a;--redbg:#3a1f1c;--amb:#f3b04f;--ambbg:#3a2d14;--grn:#6fd49a;--grnbg:#16301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}p.sub{margin:0 0 16px;color:var(--mut)}
#drop{border:2px dashed var(--bd);background:var(--card);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--ac)}#drop b{color:var(--ac)}#drop small{display:block;color:var(--mut);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar .sp{flex:1}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button{border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card.off{opacity:.55}
.card canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:4px;cursor:zoom-in;background:#fff}
.n{font-weight:600;font-size:13px;word-break:break-word}.d{font-size:12px;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.blank,.scan{background:var(--redbg);color:var(--red)}.noin{background:var(--ambbg);color:var(--amb)}.ok{background:var(--grnbg);color:var(--grn)}
label{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);overflow:auto;display:none;z-index:9;padding:16px;text-align:center}
.ov canvas{max-width:100%;height:auto;background:#fff}
#pa{display:none}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
@media print{main,.ov{display:none!important}body{background:#fff}#pa{display:block}#pa img{display:block;width:100%;max-height:100vh;object-fit:contain;page-break-after:always}}
</style></head><body>
<main>
<h1>DTR Checker <small style="font-size:12px;color:var(--mut);font-weight:400">v4 · blank or with entries</small></h1>
<p class="sub">Upload a PDF of DTRs. Blank DTRs (no times written at all) are unchecked so you can leave them out when printing.</p>
<div id="drop"><b>Click to upload</b> or drop a PDF here<small>Each page is checked as one DTR (both copies on the page are the same)</small>
<input id="f" type="file" accept=".pdf" hidden></div>
<div id="out"></div>
</main>
<div class="ov" id="ov"></div><div id="pa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TM=/\d:\d{2}/,$=id=>document.getElementById(id);
let buf,pdf,pages=[],filter='all',fname='dtr';
const drop=$('drop'),inp=$('f'),out=$('out');
drop.onclick=()=>inp.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};
inp.onchange=()=>{if(inp.files[0])load(inp.files[0])};
function analyze(items,w){
  if(!items.length)return{status:'scan',name:'',detail:'No readable text. This page may be a scan.'};
  const L=items.filter(i=>i.x<w/2);
  const times=items.filter(i=>TM.test(i.s));
  let name='';const nm=L.find(i=>/^\(?name\)?$/i.test(i.s));
  if(nm)name=L.filter(i=>i.y>nm.y+2&&i.y<nm.y+22).sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ');
  if(!times.length&&!TM.test(items.map(i=>i.s).join('')))return{status:'blank',name,detail:'Blank: no time entries.'};
  const rows=new Set(times.map(t=>Math.round(t.y/4)));
  return{status:'ok',name,detail:rows.size?rows.size+' day'+(rows.size>1?'s':'')+' with entries.':'Has time entries.'};
}
async function load(file){
  fname=file.name.replace(/\.pdf$/i,'');
  out.innerHTML='<p class="sub" id="prog">Reading…</p>';
  buf=await file.arrayBuffer();
  try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}
  catch(e){out.innerHTML='<p class="sub">Could not open this PDF.</p>';return}
  pages=[];filter='all';
  for(let n=1;n<=pdf.numPages;n++){
    $('prog').textContent='Reading page '+n+' of '+pdf.numPages+'…';
    try{
      const pg=await pdf.getPage(n),w=pg.getViewport({scale:1}).width,tc=await pg.getTextContent();
      const items=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4]+i.width/2,y:i.transform[5]}));
      const info=analyze(items,w),vp=pg.getViewport({scale:.7}),cv=document.createElement('canvas');
      cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      cv.onclick=()=>zoom(n);
      pages.push({n,cv,...info,inc:info.status==='ok'});
    }catch(e){pages.push({n,cv:document.createElement('canvas'),status:'scan',name:'',detail:'Could not read this page.',inc:false})}
  }
  render();
}
const LBL={ok:'Has entries',blank:'Blank',scan:'Unreadable'};
function render(){
  const c=s=>pages.filter(p=>p.status===s).length,sel=pages.filter(p=>p.inc).length;
  out.innerHTML=`<div class="stats"><div class="stat"><b>${pages.length}</b><span>Pages</span></div><div class="stat"><b>${c('blank')}</b><span>Blank</span></div><div class="stat"><b>${c('ok')}</b><span>With entries</span></div></div>
  <div class="bar tabs">${[['all','All'],['blank','Blank'],['ok','With entries']].map(([k,l])=>`<button class="${filter===k?'on':''}" data-k="${k}">${l}</button>`).join('')}<span class="sp"></span>
  <button id="ck">Select all non-blank</button></div>
  <div class="bar"><b>${sel} of ${pages.length} pages selected</b><span class="sp"></span><button id="dl" class="pri">Download PDF (selected)</button><button id="pr" class="pri">Print selected</button></div>
  <div class="grid" id="g"></div>`;
  const g=$('g');
  pages.filter(p=>filter==='all'||p.status===filter||(filter==='blank'&&p.status==='scan')).forEach(p=>{
    const d=document.createElement('div');d.className='card'+(p.inc?'':' off');
    d.innerHTML=`<div class="top"><span class="n">Page ${p.n}</span><span class="tag ${p.status}">${LBL[p.status]}</span></div>`;
    d.appendChild(p.cv);
    const info=document.createElement('div');
    info.innerHTML=`<div class="n">${esc(p.name||'(name not found)')}</div><div class="d">${esc(p.detail)}</div>`;
    d.appendChild(info);
    const lb=document.createElement('label');lb.innerHTML=`<input type="checkbox" ${p.inc?'checked':''}> Include in print`;
    lb.firstChild.onchange=e=>{p.inc=e.target.checked;render()};
    d.appendChild(lb);g.appendChild(d);
  });
  document.querySelectorAll('.tabs button[data-k]').forEach(b=>b.onclick=()=>{filter=b.dataset.k;render()});
  $('ck').onclick=()=>{pages.forEach(p=>p.inc=p.status==='ok');render()};
  $('dl').onclick=dl;$('pr').onclick=printSel;
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function zoom(n){
  const pg=await pdf.getPage(n),vp=pg.getViewport({scale:1.6}),cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  const ov=$('ov');ov.innerHTML='';ov.appendChild(cv);ov.style.display='block';ov.onclick=()=>ov.style.display='none';
}
async function dl(){
  const sel=pages.filter(p=>p.inc);if(!sel.length)return alert('No pages selected.');
  const{PDFDocument}=PDFLib,src=await PDFDocument.load(buf),o=await PDFDocument.create();
  (await o.copyPages(src,sel.map(p=>p.n-1))).forEach(p=>o.addPage(p));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await o.save()],{type:'application/pdf'}));
  a.download=fname+'-filtered.pdf';a.click();
}
async function printSel(){
  const sel=pages.filter(p=>p.inc);if(!sel.length)return alert('No pages selected.');
  const pa=$('pa');pa.innerHTML='';
  for(const p of sel){
    const pg=await pdf.getPage(p.n),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');
    cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const im=new Image();im.src=cv.toDataURL('image/jpeg',.92);pa.appendChild(im);
  }
  await Promise.all([...pa.children].map(i=>i.decode?i.decode().catch(()=>{}):0));
  window.print();
}
</script></body></html>
