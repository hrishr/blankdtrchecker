<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blank DTR Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0e3;--card:#fff;--tx:#1d2b22;--mut:#6a7468;--bd:#e3dac7;--ac:#3b7a57;--gold:#d5a62d;--goldtx:#4b3a08;--pill:#ece4d4;--pilltx:#5b5a3e;--hd1:#2c6648;--hd2:#1f5238;--red:#b83a2e;--redbg:#fbe4e0;--grn:#17703d;--grnbg:#d7efdf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b16;--card:#1b2a22;--tx:#e6f0e9;--mut:#9db3a5;--bd:#2b4034;--ac:#4a9a6e;--pill:#25372c;--pilltx:#c9d9cd;--red:#ff9a8a;--redbg:#3b2220;--grn:#7fe0a6;--grnbg:#1a3a29}}
:root[data-theme="dark"]{--bg:#121b16;--card:#1b2a22;--tx:#e6f0e9;--mut:#9db3a5;--bd:#2b4034;--ac:#4a9a6e;--pill:#25372c;--pilltx:#c9d9cd;--red:#ff9a8a;--redbg:#3b2220;--grn:#7fe0a6;--grnbg:#1a3a29}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.site{background:linear-gradient(180deg,var(--hd1),var(--hd2));border-bottom:5px solid var(--gold);color:#fff}
.site .wrap{display:flex;align-items:center;gap:18px;padding:14px clamp(16px,3vw,48px)}
.logo{width:76px;height:76px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.school{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(21px,3.4vw,38px);line-height:1.1;letter-spacing:.3px}
.app{font-size:clamp(12px,1.4vw,15px);font-weight:700;letter-spacing:1px;color:#f1d98a;margin-top:5px}
main{width:100%;box-sizing:border-box;padding:22px clamp(16px,3vw,48px) 48px}
p.sub{margin:0 0 16px;color:var(--mut)}
#drop,.stat,.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:0 2px 8px rgba(60,50,20,.06)}
#drop{border:2px dashed var(--ac);padding:28px 16px;text-align:center;cursor:pointer}
#drop.over{background:var(--grnbg)}#drop b{color:var(--ac)}#drop small{display:block;color:var(--mut);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 14px}
.stat{padding:12px;text-align:center}.stat b{display:block;font-size:26px;color:var(--ac)}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar .sp{flex:1}
button{border:none;background:var(--pill);color:var(--pilltx);border-radius:999px;padding:9px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff}
#pr{background:var(--gold);color:var(--goldtx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:14px}
.card{padding:10px;display:flex;flex-direction:column;gap:8px;border-radius:18px}.card.off{opacity:.55}
.card canvas{width:100%;height:auto;border-radius:8px;cursor:zoom-in;background:#fff;box-shadow:inset 0 0 0 1px var(--bd)}
.n{font-weight:700;font-size:13px;word-break:break-word}.d{font-size:12px;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.blank,.scan{background:var(--redbg);color:var(--red)}.ok{background:var(--grnbg);color:var(--grn)}
label{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;accent-color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);overflow:auto;display:none;z-index:9;padding:16px;text-align:center}
.ov canvas{max-width:100%;height:auto;background:#fff}
#pa{display:none}
@media(max-width:700px){.logo{width:54px;height:54px}.stats{gap:8px}}
@media print{main,.ov,.site{display:none!important}body{background:#fff}#pa{display:block}#pa img{display:block;width:100%;max-height:100vh;object-fit:contain;page-break-after:always}}
</style></head><body>

drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};
inp.onchange=()=>{if(inp.files[0])load(inp.files[0])};
function analyze(items,w){
  if(!items.length)return{status:'scan',name:'',detail:'No readable text. This page may be a scan.'};
  const L=items.filter(i=>i.x<w/2);
  const times=items.filter(i=>TM.test(i.s));
  let name='';const nm=L.find(i=>/^\(?name\)?$/i.test(i.s));
  if(nm)name=L.filter(i=>i.y>nm.y+2&&i.y<nm.y+22).sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ');
  if(!times.length&&!TM.test(items.map(i=>i.s).join('')))return{status:'blank',name,detail:'Blank: no time entries.'};
  const rows=new Set(times.map(t=>Math.round(t.y/4)));
  return{status:'ok',name,detail:rows.size?rows.size+' day'+(rows.size>1?'s':'')+' with entries.':'Has time entries.'};
}
async function load(file){
  fname=file.name.replace(/\.pdf$/i,'');
  out.innerHTML='<p class="sub" id="prog">Reading…</p>';
  buf=await file.arrayBuffer();
  try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}
  catch(e){out.innerHTML='<p class="sub">Could not open this PDF.</p>';return}
  pages=[];filter='all';
  for(let n=1;n<=pdf.numPages;n++){
    $('prog').textContent='Reading page '+n+' of '+pdf.numPages+'…';
    try{
      const pg=await pdf.getPage(n),w=pg.getViewport({scale:1}).width,tc=await pg.getTextContent();
      const items=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4]+i.width/2,y:i.transform[5]}));
      const info=analyze(items,w),vp=pg.getViewport({scale:1}),cv=document.createElement('canvas');
      cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      cv.onclick=()=>zoom(n);
      pages.push({n,cv,...info,inc:info.status==='ok'});
    }catch(e){pages.push({n,cv:document.createElement('canvas'),status:'scan',name:'',detail:'Could not read this page.',inc:false})}
  }
  render();
}
const LBL={ok:'Has entries',blank:'Blank',scan:'Unreadable'};
function render(){
  const c=s=>pages.filter(p=>p.status===s).length,sel=pages.filter(p=>p.inc).length;
  out.innerHTML=`<div class="stats"><div class="stat"><b>${pages.length}</b><span>Pages</span></div><div class="stat"><b>${c('blank')}</b><span>Blank</span></div><div class="stat"><b>${c('ok')}</b><span>With entries</span></div></div>
  <div class="bar tabs">${[['all','All'],['blank','Blank'],['ok','With entries']].map(([k,l])=>`<button class="${filter===k?'on':''}" data-k="${k}">${l}</button>`).join('')}<span class="sp"></span>
  <button id="ck">Select all non-blank</button></div>
  <div class="bar"><b>${sel} of ${pages.length} pages selected</b><span class="sp"></span><button id="dl" class="pri">Download PDF (selected)</button><button id="pr" class="pri">Print selected</button></div>
  <div class="grid" id="g"></div>`;
  const g=$('g');
  pages.filter(p=>filter==='all'||p.status===filter||(filter==='blank'&&p.status==='scan')).forEach(p=>{
    const d=document.createElement('div');d.className='card'+(p.inc?'':' off');
    d.innerHTML=`<div class="top"><span class="n">Page ${p.n}</span><span class="tag ${p.status}">${LBL[p.status]}</span></div>`;
    d.appendChild(p.cv);
    const info=document.createElement('div');
    info.innerHTML=`<div class="n">${esc(p.name||'(name not found)')}</div><div class="d">${esc(p.detail)}</div>`;
    d.appendChild(info);
    const lb=document.createElement('label');lb.innerHTML=`<input type="checkbox" ${p.inc?'checked':''}> Include in print`;
    lb.firstChild.onchange=e=>{p.inc=e.target.checked;render()};
    d.appendChild(lb);g.appendChild(d);
  });
  document.querySelectorAll('.tabs button[data-k]').forEach(b=>b.onclick=()=>{filter=b.dataset.k;render()});
  $('ck').onclick=()=>{pages.forEach(p=>p.inc=p.status==='ok');render()};
  $('dl').onclick=dl;$('pr').onclick=printSel;
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function zoom(n){
  const pg=await pdf.getPage(n),vp=pg.getViewport({scale:1.6}),cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  const ov=$('ov');ov.innerHTML='';ov.appendChild(cv);ov.style.display='block';ov.onclick=()=>ov.style.display='none';
}
async function dl(){
  const sel=pages.filter(p=>p.inc);if(!sel.length)return alert('No pages selected.');
  const{PDFDocument}=PDFLib,src=await PDFDocument.load(buf),o=await PDFDocument.create();
  (await o.copyPages(src,sel.map(p=>p.n-1))).forEach(p=>o.addPage(p));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await o.save()],{type:'application/pdf'}));
  a.download=fname+'-filtered.pdf';a.click();
}
async function printSel(){
  const sel=pages.filter(p=>p.inc);if(!sel.length)return alert('No pages selected.');
  const pa=$('pa');pa.innerHTML='';
  for(const p of sel){
    const pg=await pdf.getPage(p.n),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');
    cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const im=new Image();im.src=cv.toDataURL('image/jpeg',.92);pa.appendChild(im);
  }
  await Promise.all([...pa.children].map(i=>i.decode?i.decode().catch(()=>{}):0));
  window.print();
}
</script></body></html>
